name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod download
      - run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - run: go build -trimpath -o /tmp/smq ./cmd/smq
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './python[dev]'
      - name: Lint
        if: matrix.python-version == '3.14'
        working-directory: python
        run: |
          python -m ruff check src tests ../examples/python ../scripts/fix_python_proto_import.py
          python -m ruff format --check src tests ../examples/python ../scripts/fix_python_proto_import.py
      - name: Test
        working-directory: python
        run: python -m pytest --cov=pysmq --cov-report=term-missing tests
      - name: Build and verify distributions
        if: matrix.python-version == '3.14'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYSMQ: 0.0.0
        run: |
          python -m build python
          python -m twine check python/dist/*

  protobuf:
    name: Protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.50.0"
          github_token: ${{ github.token }}
      - name: Install pinned generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python -m pip install grpcio-tools==1.71.0 protobuf==5.29.4
      - run: buf lint
      - name: Check schema compatibility
        run: buf breaking --against '.git#branch=origin/main'
      - name: Check generated files
        run: |
          make generate PYTHON_BIN=python
          git diff --exit-code -- api/smq/v1 python/src/pysmq/_generated

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - run: docker build --tag smq:test .
