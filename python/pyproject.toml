[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysmq"
dynamic = ["version"]
description = "Python client for SuhaibMessageQueue"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Suhaib" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
dependencies = [
    "grpcio>=1.71,<2",
    "protobuf>=5.29,<8",
]

[project.urls]
Homepage = "https://github.com/Suhaibinator/SuhaibMessageQueue"
Repository = "https://github.com/Suhaibinator/SuhaibMessageQueue"
Issues = "https://github.com/Suhaibinator/SuhaibMessageQueue/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "grpcio-tools>=1.71,<2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.12",
    "twine>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
root = ".."
tag_regex = "^pysmq-v(?P<version>[^+]+)(?:\\+.*)?$"
git_describe_command = "git describe --dirty --tags --long --match pysmq-v*"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
omit = [
    "src/pysmq/_generated/*",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["src/pysmq/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
